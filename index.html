<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>נוכחות מועדון טניס שולחן מבואות החרמון</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1B2A41" />
  <link rel="icon" href="./icon-192.png" />

  <!-- iOS needs these to install to the home screen as a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="נוכחות מועדון" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" />
  <link rel="stylesheet" href="./tailwind.css" />
  <style>
    /* גופן עברי אחד לכל המכשירים; אם Google Fonts לא נטען — נופלים לגופן המערכת */
    body { font-family: "Assistant", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    /* סימון פוקוס למי שמנווט במקלדת (טאבלט עם מקלדת, קורא מסך) */
    :focus-visible { outline: 3px solid #2E7D6B; outline-offset: 2px; box-shadow: 0 0 0 5px #fff; }
    /* 27.9: ברירת המחדל של Tailwind לטקסט מציין-מקום היא 2.5:1 — כמעט בלתי קריא */
    ::placeholder { color: #64748b; opacity: 1; }
    /* שדות בחירה, תאריך וטקסט: לפחות 44px לאצבע (בדוחות ובהרשאות הם ירדו ל-30-40px) */
    /* 27.9: אותו כלל לכל כפתור — בהרשאות, בקבוצות, בדוחות ובפורטל כפתורים ירדו ל-16-40px.
       כפתור אייקון עגול קטן גדל גם ברוחב, כדי שיישאר עגול ולא ביצה. */
    button { min-height: 44px; }
    button[class~="w-6"], button[class~="w-7"], button[class~="w-8"] { min-width: 44px; }
    select, input[type="date"], input[type="text"], input[type="search"], input[type="tel"], input[type="email"], input[type="number"], input:not([type]) { min-height: 44px; }
    /* מי שביקש במערכת ההפעלה פחות תנועה — בלי אנימציות */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error" style="display:none;padding:24px;text-align:center;font-size:14px;color:#b91c1c;direction:rtl"></div>
  <!-- 27.9: הבאנר ישב בתחתית, על חצי מכפתור "שמירת נוכחות", וכל נגיעה בו רעננה את הדף —
       כלומר לחיצה על השמירה יכלה למחוק סימונים שטרם נשמרו. עכשיו הוא למעלה, ורק הכפתור מרענן. -->
  <div id="update-banner" role="status" style="display:none;position:fixed;inset-inline:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:#1B2A41;color:#fff;font-size:15px;direction:rtl;z-index:9999">
    <span style="display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:28rem;margin:0 auto">
      <span>יש גרסה חדשה של האפליקציה</span>
      <button id="update-go" style="min-height:44px;padding:0 16px;border:none;border-radius:10px;background:#fff;color:#1B2A41;font:inherit;font-weight:700">רענון</button>
    </span>
  </div>
  <script type="module">
    function showError(msg) {
      var el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = 'שגיאה בטעינה: ' + msg;
    }
    window.addEventListener('error', function (e) { showError(e.message || String(e.error)); });
    window.addEventListener('unhandledrejection', function (e) { showError(String(e.reason)); });
    import('./app.js').catch(function (err) { showError(err.message); });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      });

      // כשגרסה חדשה של ה-service worker תופסת שליטה על טאב שכבר פתוח (למשל
      // טאבלט של מועדון שנשאר פתוח ימים), הקוד שכבר רץ בזיכרון נשאר ישן עד
      // רענון. במקום להשאיר את זה תקוע בלי שהמאמן ישים לב, מציגים באנר קטן
      // שמזמין לרענן — לא מרעננים אוטומטית כדי לא לאבד סימוני נוכחות שטרם נשמרו.
      // בביקור הראשון במכשיר clients.claim() מחליף שליטה בלי שום גרסה חדשה — לא להציג אז
      var hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; }
        document.getElementById('update-banner').style.display = 'block';
      });
      document.getElementById('update-go').addEventListener('click', function () { window.location.reload(); });
    }
  </script>
</body>
</html>
