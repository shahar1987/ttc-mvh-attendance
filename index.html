<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>נוכחות מועדון טניס שולחן מבואות החרמון</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!--
    auth/firestore/messaging נעולים לאותה ליבה של firebase/app (@firebase/app@0.10.5).
    בלי זה esm.sh מגיש להם ליבה בגרסה חדשה יותר, נטענים שני עותקים,
    ומתקבלת השגיאה "Component auth has not been registered yet" עם מסך לבן.
  -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
      "firebase/app": "https://esm.sh/firebase@10.12.2/app",
      "firebase/auth": "https://esm.sh/firebase@10.12.2/auth?deps=@firebase/app@0.10.5",
      "firebase/firestore": "https://esm.sh/firebase@10.12.2/firestore?deps=@firebase/app@0.10.5",
      "firebase/messaging": "https://esm.sh/firebase@10.12.2/messaging?deps=@firebase/app@0.10.5"
    }
  }
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error" style="display:none;padding:24px;text-align:center;font-size:14px;color:#b91c1c;direction:rtl"></div>
  <script type="module">
    // מציג שגיאה על המסך במקום מסך לבן, כדי שיהיה אפשר לראות מה נשבר.
    function showError(msg) {
      var el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = 'שגיאה בטעינה: ' + msg;
    }
    window.addEventListener('error', function (e) { showError(e.message || String(e.error)); });
    window.addEventListener('unhandledrejection', function (e) { showError(String(e.reason)); });
    import('./bundle.js').catch(function (err) { showError(err.message); });
  </script>
</body>
</html>
