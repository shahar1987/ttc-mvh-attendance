<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>נוכחות מועדון טניס שולחן מבואות החרמון</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#172554" />
  <link rel="icon" href="./icon-192.png" />

  <!-- iOS needs these to install to the home screen as a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="נוכחות מועדון" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error" style="display:none;padding:24px;text-align:center;font-size:14px;color:#b91c1c;direction:rtl"></div>
  <script type="module">
    function showError(msg) {
      var el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = '\u05e9\u05d2\u05d9\u05d0\u05d4 \u05d1\u05d8\u05e2\u05d9\u05e0\u05d4: ' + msg;
    }
    window.addEventListener('error', function (e) { showError(e.message || String(e.error)); });
    window.addEventListener('unhandledrejection', function (e) { showError(String(e.reason)); });
    import('./app.js').catch(function (err) { showError(err.message); });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
