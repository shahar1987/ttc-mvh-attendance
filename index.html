<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>נוכחות מועדון טניס שולחן מבואות החרמון</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#172554" />
  <link rel="icon" href="./icon-192.png" />

  <!-- iOS needs these to install to the home screen as a real app -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="נוכחות מועדון" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <link rel="stylesheet" href="./tailwind.css" />
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error" style="display:none;padding:24px;text-align:center;font-size:14px;color:#b91c1c;direction:rtl"></div>
  <div id="update-banner" style="display:none;position:fixed;inset-inline:0;bottom:0;padding:10px 16px;background:#172554;color:#fff;font-size:13px;text-align:center;direction:rtl;z-index:9999;cursor:pointer">
    גרסה חדשה זמינה — לחצו לרענון
  </div>
  <script type="module">
    function showError(msg) {
      var el = document.getElementById('boot-error');
      el.style.display = 'block';
      el.textContent = 'שגיאה בטעינה: ' + msg;
    }
    window.addEventListener('error', function (e) { showError(e.message || String(e.error)); });
    window.addEventListener('unhandledrejection', function (e) { showError(String(e.reason)); });
    import('./app.js').catch(function (err) { showError(err.message); });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.warn('Service worker registration failed:', e);
        });
      });

      // כשגרסה חדשה של ה-service worker תופסת שליטה על טאב שכבר פתוח (למשל
      // טאבלט של מועדון שנשאר פתוח ימים), הקוד שכבר רץ בזיכרון נשאר ישן עד
      // רענון. במקום להשאיר את זה תקוע בלי שהמאמן ישים לב, מציגים באנר קטן
      // שמזמין לרענן — לא מרעננים אוטומטית כדי לא לאבד סימוני נוכחות שטרם נשמרו.
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        var el = document.getElementById('update-banner');
        el.style.display = 'block';
        el.addEventListener('click', function () { window.location.reload(); });
      });
    }
  </script>
</body>
</html>
