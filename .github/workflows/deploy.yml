name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install react@18.3.1 react-dom@18.3.1 lucide-react@0.383.0 firebase@10.12.2 esbuild@0.21.5 --no-audit --no-fund

      - name: Bundle everything into one self-contained file
        run: |
          mkdir -p site
          npx esbuild ./bundle.js --bundle --minify --format=esm --outfile=site/app.js

      - name: Add cache-busting version so browsers never serve a stale build
        run: |
          VERSION="${GITHUB_SHA::8}"
          echo "Build version: $VERSION"
          sed "s|./app.js|./app.js?v=$VERSION|g" index.html > site/index.html
          grep -q "app.js?v=$VERSION" site/index.html || (echo "ERROR: cache-busting substitution failed" && exit 1)

      - name: Verify the bundle is complete
        run: |
          SIZE=$(stat -c%s site/app.js)
          echo "app.js size: $SIZE bytes"
          if [ "$SIZE" -lt 200000 ]; then
            echo "ERROR: bundle too small - dependencies were probably not bundled"
            exit 1
          fi
          if grep -q 'from"react"' site/app.js; then
            echo "ERROR: bare import of react still present - not fully bundled"
            exit 1
          fi
          echo "Bundle verification passed"

      - name: Smoke test - render the app in a real browser
        run: |
          npm install playwright@1.47.0 --no-audit --no-fund
          npx playwright install --with-deps chromium
          cat > smoke.mjs <<'SMOKE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 400, height: 850 } });
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(e.message));
          await page.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'load' });
          await page.waitForTimeout(6000);
          const rootLen = await page.$eval('#root', el => el.innerHTML.length);
          const text = (await page.$eval('body', el => el.innerText)).trim();
          console.log('--- rendered text ---');
          console.log(text.slice(0, 300));
          console.log('--- root size:', rootLen, '---');
          let failed = false;
          if (pageErrors.length) {
            console.log('FAIL: runtime errors:\n' + pageErrors.join('\n'));
            failed = true;
          }
          if (rootLen < 200) {
            console.log('FAIL: app did not render (blank screen)');
            failed = true;
          }
          if (!text.includes('\u05D4\u05EA\u05D7\u05D1\u05E8\u05D5\u05EA')) {
            console.log('FAIL: login screen did not appear');
            failed = true;
          }
          await browser.close();
          process.exit(failed ? 1 : 0);
          SMOKE
          npx http-server site -p 8080 --silent &
          sleep 4
          node smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
