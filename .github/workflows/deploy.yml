name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install react@18.3.1 react-dom@18.3.1 lucide-react@0.383.0 firebase@10.12.2 esbuild@0.21.5 sharp@0.33.4 --no-audit --no-fund

      - name: Reassemble the app source
        run: |
          if [ -f part-a.js ] && [ -f part-b.js ]; then
            cat part-a.js part-b.js > bundle.js
            echo "Reassembled bundle.js ($(stat -c%s bundle.js) bytes)"
          else
            echo "Using bundle.js as-is ($(stat -c%s bundle.js) bytes)"
          fi

      - name: Bundle everything into one self-contained file
        run: |
          mkdir -p site
          npx esbuild ./bundle.js --bundle --minify --format=esm --outfile=site/app.js

      - name: Generate PWA icons from logo.png
        run: |
          cat > mkicons.mjs <<'ICONS'
          import sharp from 'sharp';
          const SRC = 'logo.png';
          // Plain icons: trim the transparent/white frame, then pad back 8% on a white square.
          for (const size of [192, 512]) {
            const inner = Math.round(size * 0.84);
            const art = await sharp(SRC).trim().resize(inner, inner, {
              fit: 'contain',
              background: { r: 255, g: 255, b: 255, alpha: 0 },
            }).png().toBuffer();
            await sharp({
              create: { width: size, height: size, channels: 4, background: '#ffffff' },
            })
              .composite([{ input: art, gravity: 'center' }])
              .png()
              .toFile(`site/icon-${size}.png`);
          }
          // Maskable icon: the art must live inside the 66% safe zone, on a filled square.
          const safe = Math.round(512 * 0.66);
          const maskArt = await sharp(SRC).trim().resize(safe, safe, {
            fit: 'contain',
            background: { r: 255, g: 255, b: 255, alpha: 0 },
          }).png().toBuffer();
          await sharp({
            create: { width: 512, height: 512, channels: 4, background: '#ffffff' },
          })
            .composite([{ input: maskArt, gravity: 'center' }])
            .png()
            .toFile('site/icon-512-maskable.png');
          ICONS
          node mkicons.mjs
          cp logo.png site/logo.png

      - name: Assemble the site with a cache-busting version
        run: |
          VERSION="${GITHUB_SHA::8}"
          sed "s|./app.js|./app.js?v=$VERSION|g" index.html > site/index.html
          sed "s|__BUILD_VERSION__|$VERSION|g" sw.js > site/sw.js
          cp manifest.json site/manifest.json
          grep -q "app.js?v=$VERSION" site/index.html || (echo "ERROR: cache-busting failed" && exit 1)

      - name: Verify the build
        run: |
          SIZE=$(stat -c%s site/app.js)
          echo "app.js size: $SIZE bytes"
          [ "$SIZE" -ge 200000 ] || (echo "ERROR: bundle too small" && exit 1)
          ! grep -q 'from"react"' site/app.js || (echo "ERROR: bare react import" && exit 1)
          for f in index.html app.js manifest.json sw.js logo.png icon-192.png icon-512.png icon-512-maskable.png; do
            [ -f "site/$f" ] || (echo "ERROR: missing site/$f" && exit 1)
          done

      - name: Smoke test in a real browser
        run: |
          npm install playwright@1.47.0 http-server@14.1.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          cat > smoke.mjs <<'SMOKE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 400, height: 850 } });
          const errs = [];
          page.on('pageerror', e => errs.push(e.message));
          await page.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'load' });
          await page.waitForTimeout(6000);
          const rootLen = await page.$eval('#root', el => el.innerHTML.length);
          const text = (await page.$eval('body', el => el.innerText)).trim();
          const dir = await page.evaluate(() => document.documentElement.dir);
          console.log(text.slice(0, 300));
          let failed = false;
          if (errs.length) { console.log('FAIL errors:\n' + errs.join('\n')); failed = true; }
          if (rootLen < 200) { console.log('FAIL: blank screen'); failed = true; }
          if (!text.includes('\u05D4\u05EA\u05D7\u05D1\u05E8\u05D5\u05EA')) { console.log('FAIL: no login screen'); failed = true; }
          if (dir !== 'rtl') { console.log('FAIL: not RTL'); failed = true; }
          await browser.close();
          process.exit(failed ? 1 : 0);
          SMOKE
          npx http-server site -p 8080 --silent &
          sleep 4
          node smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
