name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# לא מבטלים בנייה שכבר רצה: ביטול באמצע פרסום משאיר את האתר על גרסה ישנה בלי שום סימן אדום
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Privacy guard - no real phone numbers in the source
        run: |
          MATCHES=$(grep -rnoE '(\+?972[- ]?5[0-9][- ]?[0-9]{3}[- ]?[0-9]{4}|05[0-9][- ]?[0-9]{3}[- ]?[0-9]{4})' \
            part-a.js part-b.js index.html sw.js manifest.json README.md tttm.json 2>/dev/null \
            | grep -vE '050-?1234567' || true)
          if [ -n "$MATCHES" ]; then
            echo "ERROR: phone-number-like values found in source files:"
            echo "$MATCHES"
            echo "Personal data must live only in Firestore, never in the source code."
            exit 1
          fi
          echo "Privacy guard passed - no phone numbers in source."

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install react@18.3.1 react-dom@18.3.1 lucide-react@0.383.0 firebase@10.12.2 esbuild@0.21.5 sharp@0.33.4 --no-audit --no-fund

      - name: Reassemble the app source
        run: |
          if [ -f part-a.js ] && [ -f part-b.js ]; then
            cat part-a.js part-b.js > bundle.js
            echo "Reassembled bundle.js ($(stat -c%s bundle.js) bytes)"
          else
            echo "Using bundle.js as-is ($(stat -c%s bundle.js) bytes)"
          fi

      - name: Bundle everything into one self-contained file
        run: |
          mkdir -p site
          npx esbuild ./bundle.js --bundle --minify --format=esm --outfile=site/app.js

      - name: Build Tailwind CSS locally (self-hosted, works offline)
        run: |
          npm install tailwindcss@3.4.10 --no-audit --no-fund
          cat > tailwind.config.js <<'TW'
          module.exports = { content: ["./bundle.js", "./index.html"], theme: { extend: {} } };
          TW
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > tw-input.css
          npx tailwindcss -c tailwind.config.js -i tw-input.css -o site/tailwind.css --minify
          SIZE=$(stat -c%s site/tailwind.css)
          echo "tailwind.css size: $SIZE bytes"
          [ "$SIZE" -ge 10000 ] || (echo "ERROR: tailwind.css too small - class scan failed" && exit 1)

      - name: Generate PWA icons from logo.png
        run: |
          cat > mkicons.mjs <<'ICONS'
          import sharp from 'sharp';
          const SRC = 'logo.png';
          // Plain icons: trim the transparent/white frame, then pad back 8% on a white square.
          for (const size of [192, 512]) {
            const inner = Math.round(size * 0.84);
            const art = await sharp(SRC).trim().resize(inner, inner, {
              fit: 'contain',
              background: { r: 255, g: 255, b: 255, alpha: 0 },
            }).png().toBuffer();
            await sharp({
              create: { width: size, height: size, channels: 4, background: '#ffffff' },
            })
              .composite([{ input: art, gravity: 'center' }])
              .png()
              .toFile(`site/icon-${size}.png`);
          }
          // Maskable icon: the art must live inside the 66% safe zone, on a filled square.
          const safe = Math.round(512 * 0.66);
          const maskArt = await sharp(SRC).trim().resize(safe, safe, {
            fit: 'contain',
            background: { r: 255, g: 255, b: 255, alpha: 0 },
          }).png().toBuffer();
          await sharp({
            create: { width: 512, height: 512, channels: 4, background: '#ffffff' },
          })
            .composite([{ input: maskArt, gravity: 'center' }])
            .png()
            .toFile('site/icon-512-maskable.png');
          ICONS
          node mkicons.mjs
          cp logo.png site/logo.png

      - name: Assemble the site with a cache-busting version
        run: |
          VERSION="${GITHUB_SHA::8}"
          sed "s|./app.js|./app.js?v=$VERSION|g; s|./tailwind.css|./tailwind.css?v=$VERSION|g" index.html > site/index.html
          sed "s|__BUILD_VERSION__|$VERSION|g" sw.js > site/sw.js
          cp manifest.json site/manifest.json
          if [ -f tttm.json ]; then cp tttm.json site/tttm.json; else echo '{"players":[]}' > site/tttm.json; fi
          grep -q "app.js?v=$VERSION" site/index.html || (echo "ERROR: cache-busting failed" && exit 1)
          grep -q "tailwind.css?v=$VERSION" site/index.html || (echo "ERROR: tailwind cache-busting failed" && exit 1)
          ! grep -q '__BUILD_VERSION__' site/sw.js || (echo "ERROR: sw.js version placeholder not replaced" && exit 1)

      - name: Verify the build
        run: |
          SIZE=$(stat -c%s site/app.js)
          echo "app.js size: $SIZE bytes"
          [ "$SIZE" -ge 200000 ] || (echo "ERROR: bundle too small" && exit 1)
          ! grep -q 'from"react"' site/app.js || (echo "ERROR: bare react import" && exit 1)
          for f in index.html app.js tailwind.css manifest.json sw.js logo.png icon-192.png icon-512.png icon-512-maskable.png; do
            [ -f "site/$f" ] || (echo "ERROR: missing site/$f" && exit 1)
          done

      - name: Smoke test in a real browser
        run: |
          npm install playwright@1.47.0 http-server@14.1.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          cat > smoke.mjs <<'SMOKE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 400, height: 850 } });
          const errs = [];
          page.on('pageerror', e => errs.push(e.message));
          await page.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'load' });
          await page.waitForTimeout(6000);
          const rootLen = await page.$eval('#root', el => el.innerHTML.length);
          const text = (await page.$eval('body', el => el.innerText)).trim();
          const dir = await page.evaluate(() => document.documentElement.dir);
          console.log(text.slice(0, 300));
          let failed = false;
          if (errs.length) { console.log('FAIL errors:\n' + errs.join('\n')); failed = true; }
          if (rootLen < 200) { console.log('FAIL: blank screen'); failed = true; }
          if (!text.includes('\u05D4\u05EA\u05D7\u05D1\u05E8\u05D5\u05EA')) { console.log('FAIL: no login screen'); failed = true; }
          if (dir !== 'rtl') { console.log('FAIL: not RTL'); failed = true; }
          await browser.close();
          process.exit(failed ? 1 : 0);
          SMOKE
          npx http-server site -p 8080 --silent &
          sleep 4
          node smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Open an issue if the build failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ הבנייה של האפליקציה נכשלה" \
            --body "ריצה שנכשלה: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.repository_owner }} || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
