name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install react@18.3.1 react-dom@18.3.1 lucide-react@0.383.0 firebase@10.12.2 esbuild@0.21.5 sharp@0.33.4 --no-audit --no-fund

      - name: Bundle everything into one self-contained file
        run: |
          mkdir -p site
          npx esbuild ./bundle.js --bundle --minify --format=esm --outfile=site/app.js

      - name: Generate PWA icons from icon.svg
        run: |
          cat > mkicons.mjs <<'ICONS'
          import sharp from 'sharp';
          import { readFileSync } from 'fs';
          const svg = readFileSync('icon.svg');
          for (const size of [192, 512]) {
            await sharp(svg, { density: 384 }).resize(size, size).png()
              .toFile(`site/icon-${size}.png`);
            console.log('wrote site/icon-' + size + '.png');
          }
          ICONS
          node mkicons.mjs

      - name: Assemble the site with a cache-busting version
        run: |
          VERSION="${GITHUB_SHA::8}"
          echo "Build version: $VERSION"
          sed "s|./app.js|./app.js?v=$VERSION|g" index.html > site/index.html
          sed "s|__BUILD_VERSION__|$VERSION|g" sw.js > site/sw.js
          cp manifest.json site/manifest.json
          grep -q "app.js?v=$VERSION" site/index.html || (echo "ERROR: cache-busting failed" && exit 1)
          grep -q "$VERSION" site/sw.js || (echo "ERROR: sw version substitution failed" && exit 1)

      - name: Verify the build
        run: |
          SIZE=$(stat -c%s site/app.js)
          echo "app.js size: $SIZE bytes"
          [ "$SIZE" -ge 200000 ] || (echo "ERROR: bundle too small - deps not bundled" && exit 1)
          ! grep -q 'from"react"' site/app.js || (echo "ERROR: bare react import present" && exit 1)
          for f in index.html app.js manifest.json sw.js icon-192.png icon-512.png; do
            [ -f "site/$f" ] || (echo "ERROR: missing site/$f" && exit 1)
          done
          echo "Build verification passed"

      - name: Smoke test - render the app in a real browser
        run: |
          npm install playwright@1.47.0 http-server@14.1.1 --no-audit --no-fund
          npx playwright install --with-deps chromium
          cat > smoke.mjs <<'SMOKE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 400, height: 850 } });
          const pageErrors = [];
          page.on('pageerror', e => pageErrors.push(e.message));
          await page.goto('http://127.0.0.1:8080/index.html', { waitUntil: 'load' });
          await page.waitForTimeout(6000);
          const rootLen = await page.$eval('#root', el => el.innerHTML.length);
          const text = (await page.$eval('body', el => el.innerText)).trim();
          const dir = await page.evaluate(() => document.documentElement.dir);
          console.log('--- rendered text ---');
          console.log(text.slice(0, 300));
          console.log('--- root size:', rootLen, '| dir:', dir, '---');
          let failed = false;
          if (pageErrors.length) { console.log('FAIL runtime errors:\n' + pageErrors.join('\n')); failed = true; }
          if (rootLen < 200) { console.log('FAIL: blank screen'); failed = true; }
          if (!text.includes('\u05D4\u05EA\u05D7\u05D1\u05E8\u05D5\u05EA')) { console.log('FAIL: login screen missing'); failed = true; }
          if (dir !== 'rtl') { console.log('FAIL: page is not RTL'); failed = true; }
          await browser.close();
          process.exit(failed ? 1 : 0);
          SMOKE
          npx http-server site -p 8080 --silent &
          sleep 4
          node smoke.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
