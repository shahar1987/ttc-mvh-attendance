name: Sync payment status

# קורא את קובץ הנרשמים/משלמים מתיקיית הדרייב הייעודית ומעדכן את השדה
# players.notPaying ב-Firestore (scripts/sync_payments.mjs). מוצג באפליקציה
# במסך "מי לא משלם" (בתוך אזור הניהול).
#
# רץ בשלושה מצבים: פעם בשבוע (סנכרון מלא), בכל לחיצה על "רענון עכשיו"
# באפליקציה (בדיקה קצרה כל 10 דקות שמאתרת בקשה ממתינה ב-system/paymentSyncRequest),
# והרצה ידנית מהלשונית Actions.
#
# משתמש באותו service account שכבר קיים בריפו הזה (FIREBASE_SERVICE_ACCOUNT) —
# הוא שותף כ-Viewer בתיקיית הדרייב, ו-Google Drive API הופעל עבורו בפרויקט
# ttcmh-2a752. אין סוד נוסף שצריך להוסיף.
#
# פרטיות: הריפו ציבורי, והסקריפט מודפס ליומן ההרצה רק מספרים — לעולם לא שמות
# שחקנים. שמות שלא זוהו נשמרים ב-Firestore (מוגן בהרשאות) לבדיקת המנהל באפליקציה.
on:
  schedule:
    - cron: "0 1 * * *"     # כל יום, סביב 03:00-04:00 שעון ישראל — סנכרון מלא
    - cron: "*/10 * * * *"  # כל 10 דקות: בדיקה קצרה אם נלחץ "רענון עכשיו" באפליקציה
  workflow_dispatch:        # מאפשר גם הרצה ידנית מהלשונית Actions

permissions:
  contents: read
  issues: write

concurrency:
  group: sync-payments
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install firebase-admin@12.7.0 google-auth-library@11.0.2 xlsx@0.18.5 --no-audit --no-fund

      - name: Sync payment status from Drive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # ריצת ה-10 דקות רק בודקת אם יש בקשת רענון ממתינה ויוצאת מיד אם אין.
          # הריצה השבועית וההרצה הידנית תמיד מסנכרנות במלואן.
          SYNC_MODE: ${{ github.event.schedule == '*/10 * * * *' && 'ondemand' || 'full' }}
        run: node scripts/sync_payments.mjs

      # לא פותחים issue על כישלון בבדיקת ה-10 דקות — אחרת ייווצרו עשרות issues ביום
      - name: Open an issue if the sync failed
        if: failure() && github.event.schedule != '*/10 * * * *'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ סנכרון קובץ התשלומים מהדרייב נכשל" \
            --body "ריצה שנכשלה: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.repository_owner }} || true
