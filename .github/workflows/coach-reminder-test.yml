# בדיקה חד-פעמית: תזכורת נוכחות מהבוט ישר למאמנים (agents/coach-reminder-test.mjs). יימחק אחרי שרץ.
name: Coach reminder test

on:
  push:
    branches: [main]
    paths: [".github/workflows/coach-reminder-test.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: agents
        run: npm ci --no-audit --no-fund
      - name: Send test reminders
        working-directory: agents
        run: node coach-reminder-test.mjs
