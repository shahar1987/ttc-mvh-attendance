name: Account tools

# מבצע בקשות ניהול חשבונות שנוצרות מתוך האפליקציה (מסך ניהול הרשאות):
# בדיקה אם קיים חשבון התחברות, ואיפוס גישה שמוחק חשבון, פרופיל וקישורים.
#
# אין כאן שום פרמטר: הריפו ציבורי והיומנים גלויים, ולכן פרטים אישיים
# לא עוברים דרך GitHub. הבקשה נוצרת באפליקציה והתשובה חוזרת אליה.
#
# דורש סוד בשם FIREBASE_SERVICE_ACCOUNT (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: account-tools
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Firebase admin library
        run: npm install firebase-admin@12.7.0 --no-audit --no-fund

      - name: Process pending account tasks
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/admin_tool.mjs
