name: Portal cleanup (one-off)

# חד-פעמי, ידני בלבד: מפרסם את firestore.rules שב-main ומוחק את ה-Worker הישן של הפורטל.
# שמירה: מפרסם רק אם הכללים החיים זהים לגרסה הקודמת בריפו (14f2701) או כבר לחדשה —
# כך שום שינוי שנעשה ידנית בקונסולה לא נדרס. הלוג מדפיס רק גיבובים ושמות, בלי נתונים.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish Firestore rules (guarded)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          git show 14f2701:firestore.rules > /tmp/prev.rules
          pip install -q google-auth requests
          python3 - <<'PY'
          import json, os, hashlib, sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession
          sa = json.loads(os.environ["SA"]); p = sa["project_id"]
          s = AuthorizedSession(service_account.Credentials.from_service_account_info(
              sa, scopes=["https://www.googleapis.com/auth/cloud-platform"]))
          base = "https://firebaserules.googleapis.com/v1"
          norm = lambda t: "\n".join(l.rstrip() for l in t.replace("\r\n", "\n").strip().split("\n"))
          h = lambda t: hashlib.sha256(norm(t).encode()).hexdigest()[:16]
          rel = s.get(f"{base}/projects/{p}/releases/cloud.firestore"); rel.raise_for_status()
          old = rel.json()["rulesetName"]
          live = s.get(f"{base}/{old}"); live.raise_for_status()
          live_src = live.json()["source"]["files"][0]["content"]
          new_src, prev_src = open("firestore.rules").read(), open("/tmp/prev.rules").read()
          print("live", h(live_src), "prev", h(prev_src), "new", h(new_src), "rollback ruleset:", old)
          if h(live_src) == h(new_src):
              print("already published - nothing to do"); sys.exit(0)
          if h(live_src) != h(prev_src):
              print("LIVE RULES DIFFER FROM THE REPO - not publishing. Diff:")
              import difflib
              print("\n".join(difflib.unified_diff(norm(live_src).split("\n"), norm(prev_src).split("\n"), "live", "repo-prev", lineterm="", n=1)))
              sys.exit(1)
          r = s.post(f"{base}/projects/{p}/rulesets", json={"source": {"files": [{"name": "firestore.rules", "content": new_src}]}})
          print("compile:", r.status_code); r.raise_for_status()
          name = r.json()["name"]
          u = s.patch(f"{base}/projects/{p}/releases/cloud.firestore",
                      json={"release": {"name": f"projects/{p}/releases/cloud.firestore", "rulesetName": name}})
          print("release:", u.status_code); u.raise_for_status()
          check = s.get(f"{base}/projects/{p}/releases/cloud.firestore").json()["rulesetName"]
          assert check == name, "release did not switch"
          print("PUBLISHED", name)
          PY

      - name: Delete the old portal login Worker
        if: always()
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'b584bf6b6f69d01daa7e58dac7e1acee' }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts"
          curl -s -H "Authorization: Bearer $CF" "$API" | jq -r '.result[].id' | tee /tmp/before.txt
          if grep -qx ttc-mvh-login /tmp/before.txt; then
            curl -s -X DELETE -H "Authorization: Bearer $CF" "$API/ttc-mvh-login" | jq '{success, errors}'
          else
            echo "ttc-mvh-login already gone"
          fi
          echo "after:"; curl -s -H "Authorization: Bearer $CF" "$API" | jq -r '.result[].id'
