name: Voice note to owner

# הודעה קולית בעברית לבעלים בוואטסאפ (agents/voice.mjs). Claude מפעיל את זה כשהבעלים מבקש
# ("תקריא לי", סיכום בוקר בקול). הקלט לא מודפס ביומן. השליחה עצמה מה-worker, תוך רבע שעה.
on:
  workflow_dispatch:
    inputs:
      text:
        description: "מה להקריא (עד 1500 תווים)"
        required: true

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install voice tools
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install --quiet edge-tts==7.3.1
      - name: Install dependencies
        working-directory: agents
        run: npm ci --no-audit --no-fund
      - name: Record and queue
        working-directory: agents
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node voice.mjs
