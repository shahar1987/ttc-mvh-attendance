name: Agents setup

# מעלה את בוט הוואטסאפ (worker/) ל-Cloudflare ומחבר אותו ל-Meta (agents/setup.mjs).
# רץ לבד בכל שינוי בבוט, ואפשר להריץ ידנית מהלשונית Actions.
# הסודות הנדרשים מפורטים ב"מדריך ההקמה" (Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "agents/lib/**"
      - "agents/templates.mjs"
      - "agents/setup.mjs"
      - ".github/workflows/agents-setup.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_WABA_ID: ${{ secrets.WHATSAPP_WABA_ID || '2217359029663578' }} # מזהה, לא סוד
      META_APP_ID: ${{ secrets.META_APP_ID || '2171414330077933' }} # מזהה, לא סוד
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      OWNER_PHONE: ${{ secrets.OWNER_PHONE }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # רשות — חיבור שולה למייל וליומן (ראו מדריך הסודות)
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'b584bf6b6f69d01daa7e58dac7e1acee' }} # מזהה, לא סוד
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # עדיף להיכשל מיד עם רשימה ברורה של מה חסר
      # בדחיפה רגילה לפני שההקמה הושלמה מדלגים בשקט; בהרצה ידנית נכשלים עם רשימה ברורה
      - name: Check that the secrets exist
        id: check
        run: |
          MISSING=""
          # רק שני אלה חובה. הטוקן של וואטסאפ, ה-App Secret, מפתח Gemini והמספר כבר שמורים
          # ב-worker הקיים בקלאודפלייר (נשמרים בין פריסות), ומה שמוגדר כאן רק מחליף אותם.
          for k in FIREBASE_SERVICE_ACCOUNT CLOUDFLARE_API_TOKEN; do
            [ -z "${!k}" ] && MISSING="$MISSING $k"
          done
          if [ -n "$MISSING" ]; then
            echo "חסרים Secrets:$MISSING"
            echo "להוסיף ב: Settings > Secrets and variables > Actions (ראו מדריך ההקמה)"
            [ "${{ github.event_name }}" = "workflow_dispatch" ] && exit 1
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "כל ה-Secrets קיימים"

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: |
          (cd worker && npm ci --no-audit --no-fund)
          (cd agents && npm ci --no-audit --no-fund)

      # ✅ לא מעלים לשולה קוד שהבדיקות שלו נכשלות (וואטסאפ, Gemini ו-Firestore מדומים — בלי רשת ובלי סודות)
      - name: Run the bot's tests
        if: steps.check.outputs.ready == 'true'
        run: |
          (cd worker && npm test)
          (cd agents && npm test)

      # חשבון Cloudflare חדש צריך תת-דומיין workers.dev לפני הפריסה הראשונה
      - name: Make sure the account has a workers.dev subdomain
        if: steps.check.outputs.ready == 'true'
        id: sub
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            SUB="ttc-mvh-$(openssl rand -hex 3)"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"$SUB\"}" "$API" | jq -r '.success'
          fi
          echo "url=https://shula-whatsapp.$SUB.workers.dev" >> "$GITHUB_OUTPUT"

      # הגרסה שרצה עכשיו — לחזור אליה אם הגרסה החדשה לא עונה (Rollback למטה)
      - name: Remember the live version
        if: steps.check.outputs.ready == 'true'
        id: prev
        working-directory: worker
        run: echo "id=$(npx wrangler deployments status --json 2>/dev/null | jq -r '.versions[0].version_id // empty' 2>/dev/null)" >> "$GITHUB_OUTPUT"

      # 📨 תור להודעות (חינמי) — נותן לשולה 2 דקות להודעה במקום 30 שניות. אם אין הרשאה — ממשיכים בלי תור
      - name: Make sure the message queue exists
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          if npx wrangler queues info shula-messages >/dev/null 2>&1 || npx wrangler queues create shula-messages; then
            cat queue.toml >> wrangler.toml
            echo "התור קיים — שולה תעבוד דרכו"
          else
            echo "::warning::לא הצלחתי ליצור תור ב-Cloudflare (כנראה לטוקן אין הרשאת Queues: Edit). שולה עובדת בלי תור, כמו קודם."
          fi

      - name: Deploy the bot to Cloudflare
        if: steps.check.outputs.ready == 'true'
        id: deploy
        working-directory: worker
        run: npx wrangler deploy

      - name: Give the bot its secrets
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          umask 077
          VERIFY=""
          [ -n "$META_APP_SECRET" ] && VERIFY=$(node -e 'console.log(require("crypto").createHmac("sha256", process.env.META_APP_SECRET).update("webhook").digest("hex"))')
          jq -n \
            --arg a "$WHATSAPP_TOKEN" --arg b "$WHATSAPP_PHONE_ID" --arg c "$OWNER_PHONE" \
            --arg d "$META_APP_SECRET" --arg e "$VERIFY" --arg f "$GEMINI_API_KEY" --arg g "$FIREBASE_SERVICE_ACCOUNT" \
            --arg h "$GOOGLE_CLIENT_ID" --arg i "$GOOGLE_CLIENT_SECRET" \
            '{WHATSAPP_TOKEN:$a, WHATSAPP_PHONE_ID:$b, OWNER_PHONE:$c, META_APP_SECRET:$d, WEBHOOK_VERIFY_TOKEN:$e, GEMINI_API_KEY:$f, FIREBASE_SERVICE_ACCOUNT:$g, GOOGLE_CLIENT_ID:$h, GOOGLE_CLIENT_SECRET:$i} | with_entries(select(.value != ""))' \
            > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          rm /tmp/secrets.json

      # לא רק "עונה": גם הכתובת של וואטסאפ דוחה הודעה בלי חתימה (401), וגם מקבלת הודעה חתומה ממספר זר (200, בלי לענות לאף אחד)
      - name: Check the bot is alive
        if: steps.check.outputs.ready == 'true'
        run: |
          URL="${{ steps.sub.outputs.url }}"
          sleep 5
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors "$URL/health"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' "$URL/webhook")
          [ "$CODE" = "401" ] || { echo "webhook בלי חתימה החזיר $CODE במקום 401"; exit 1; }
          if [ -n "$META_APP_SECRET" ]; then
            BODY='{"entry":[{"changes":[{"value":{"messages":[{"id":"deploy-check","from":"0","type":"text","text":{"body":"x"}}]}}]}]}'
            SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$META_APP_SECRET" | sed 's/.* //')
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "x-hub-signature-256: sha256=$SIG" -d "$BODY" "$URL/webhook")
            [ "$CODE" = "200" ] || { echo "webhook חתום החזיר $CODE במקום 200"; exit 1; }
          fi
          echo "שולה חיה ועונה"

      # ↩️ הגרסה החדשה לא עונה → חוזרים לגרסה שרצה לפני הפריסה, והריצה נשארת אדומה (שולה תתריע עליה)
      - name: Roll back if the new version is broken
        if: failure() && steps.deploy.outcome == 'success'
        working-directory: worker
        run: |
          npx wrangler rollback ${{ steps.prev.outputs.id }} -y -m "הבדיקה אחרי הפריסה נכשלה — חוזרים לגרסה הקודמת"
          sleep 5
          curl -sf --retry 3 --retry-delay 5 --retry-all-errors "${{ steps.sub.outputs.url }}/health" && echo "חזרנו לגרסה הקודמת, שולה עונה"

      # רק כשכל הסודות של Meta הוגדרו גם כאן; אחרת ה-webhook הקיים (שכבר מחובר לאותה כתובת) נשאר כמו שהוא
      - name: Connect WhatsApp and submit message templates
        if: steps.check.outputs.ready == 'true' && env.WHATSAPP_TOKEN != '' && env.WHATSAPP_PHONE_ID != '' && env.META_APP_SECRET != ''
        working-directory: agents
        env:
          WORKER_URL: ${{ steps.sub.outputs.url }}
        run: node setup.mjs
