name: Check Claude fallback

# בדיקה חד-פעמית, קריאה בלבד: האם הגיבוי של שולה ל-Claude עונה עם המודל והמפתח האמיתיים.
# שולח בקשה בפורמט Gemini דרך אותו קוד של הבוט (worker/src/claude.js). התוצאה מופיעה כהערה בריצה.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'b584bf6b6f69d01daa7e58dac7e1acee' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Live bot health
        run: |
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          H=$(curl -s "https://shula-whatsapp.$SUB.workers.dev/health")
          echo "::notice title=health::claudeFallback=$(echo "$H" | jq -c '.claudeFallback // "missing"')"
      - name: Fallback call through the bot's code
        run: |
          cat > /tmp/t.mjs <<'EOF'
          import { claude, CLAUDE_MODEL } from "${{ github.workspace }}/worker/src/claude.js";
          const body = {
            systemInstruction: { parts: [{ text: "את שולה. עני במילה אחת." }] },
            contents: [{ role: "user", parts: [{ text: "בדיקה" }] }],
            tools: [{ functionDeclarations: [{ name: "ping", description: "בדיקה", parameters: { type: "object", properties: {} } }] }],
            generationConfig: { temperature: 0.4, maxOutputTokens: 50 },
          };
          const trace = [];
          try {
            const parts = await claude(process.env, body, trace);
            console.log(`::notice title=fallback OK::${trace.join(" ")} → ${JSON.stringify(parts).slice(0, 120)}`);
          } catch (e) {
            console.log(`::error title=fallback FAILED::${trace.join(" ")} ${e.message}`);
            process.exit(1);
          }
          EOF
          node /tmp/t.mjs
