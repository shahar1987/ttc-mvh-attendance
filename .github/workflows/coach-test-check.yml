# בדיקה חד-פעמית לקריאה בלבד (agents/coach-test-check.mjs). יימחק אחרי שרץ.
name: Coach test check
on:
  push:
    branches: [main]
    paths: [".github/workflows/coach-test-check.yml"]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - working-directory: agents
        run: npm ci --no-audit --no-fund && node coach-test-check.mjs
