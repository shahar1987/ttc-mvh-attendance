# One-off: deploys the private shula-tools Worker from an encrypted bundle (ciphertext only). Temporary branch, deleted after.
name: tools-deploy (one-off)
on:
  push:
    branches: [claude/company-deploy]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b584bf6b6f69d01daa7e58dac7e1acee
      KV: https://api.cloudflare.com/client/v4/accounts/b584bf6b6f69d01daa7e58dac7e1acee/storage/kv/namespaces/8e4636ef28d44011ac23041f20a3e615/values
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: |
          set -euo pipefail
          say() { curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: text/plain" --data "$1" "$KV/status" >/dev/null || true; }
          trap 'say "failed at line $LINENO"' ERR
          get() { curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$KV/$1"; }
          K=$(get k); echo "::add-mask::$K"
          BK=$(get bk); echo "::add-mask::$BK"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass "pass:$K" -in .transfer/tools.enc | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/shula-tools"
          say "deploying"
          npx -y wrangler@4 deploy > "$RUNNER_TEMP/d.log" 2>&1 || { say "deploy failed: $(tail -c 700 "$RUNNER_TEMP/d.log")"; exit 1; }
          printf %s "$BK" | npx -y wrangler@4 secret put COMPANY_BRIDGE_KEY > /dev/null 2>&1 || { say "deployed, secret failed"; exit 1; }
          say "done"
