# One-off: deploys the private shula-company Worker from an encrypted bundle (ciphertext only). Temporary branch, deleted after.
name: company-deploy (one-off)
on:
  push:
    branches: [claude/company-deploy]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b584bf6b6f69d01daa7e58dac7e1acee
      KV: https://api.cloudflare.com/client/v4/accounts/b584bf6b6f69d01daa7e58dac7e1acee/storage/kv/namespaces/b4c908859a8d466a878410e489d2e270/values
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: |
          set -euo pipefail
          say() { curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: text/plain" --data "$1" "$KV/status" >/dev/null || true; }
          trap 'say "failed at line $LINENO"' ERR
          K=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$KV/k")
          echo "::add-mask::$K"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass "pass:$K" -in .transfer/company.enc | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/company"
          node build.mjs
          say "deploying"
          npx -y wrangler@4 deploy > "$RUNNER_TEMP/d.log" 2>&1 || { say "deploy failed: $(tail -c 600 "$RUNNER_TEMP/d.log")"; exit 1; }
          say "done"
