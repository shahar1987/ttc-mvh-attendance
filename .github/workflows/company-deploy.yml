# One-off: deploys the private shula-company Worker from an encrypted bundle (ciphertext only) and gives it the Claude key.
# Runs only on this temporary branch, which is deleted right after.
name: company-deploy (one-off)
on:
  push:
    branches: [claude/company-deploy]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b584bf6b6f69d01daa7e58dac7e1acee
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      KV: https://api.cloudflare.com/client/v4/accounts/b584bf6b6f69d01daa7e58dac7e1acee/storage/kv/namespaces/15810d1bae2f486ab4ea936d9233b6dc/values
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: |
          set -euo pipefail
          say() { curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: text/plain" --data "$1" "$KV/status" >/dev/null || true; }
          trap 'say "failed at line $LINENO"' ERR
          say "started"
          K=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$KV/k")
          echo "::add-mask::$K"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass "pass:$K" -in .transfer/company.enc | tar xz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/company"
          node build.mjs
          say "deploying"
          npx -y wrangler@4 deploy > "$RUNNER_TEMP/deploy.log" 2>&1 || { say "deploy failed: $(tail -c 600 "$RUNNER_TEMP/deploy.log")"; exit 1; }
          say "deployed"
          [ -n "$ANTHROPIC_API_KEY" ] || { say "deployed, no ANTHROPIC_API_KEY secret in repo"; exit 1; }
          printf %s "$ANTHROPIC_API_KEY" | npx -y wrangler@4 secret put ANTHROPIC_API_KEY > /dev/null 2>&1 || { say "deployed, secret put failed"; exit 1; }
          say "done"
