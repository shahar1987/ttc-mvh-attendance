name: Camp goals cleanup (one-off)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/camp-goals-cleanup.yml']
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install firebase-admin@12.7.0 --no-audit --no-fund
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/camp_goals_cleanup.mjs
