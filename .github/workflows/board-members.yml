name: Board members match

# מתאים את מי שנרשם בלוח המועדון (boardMembers) לכרטיס שחקן לפי טלפון
# (scripts/match_board_members.mjs) וכותב את התוצאה ל-boardMemberMatches — מוצג בדף הניהול בפורטל
# (בעל הלוח בלבד). נרשם חדש שלא נמצא — הודעה לשולה בוואטסאפ
# דרך התור של הבוט (agentReports/bot.outboxQueue), כמו agents/alert.mjs.
# שלב שני: הרשמות לאירועים (eventSignups) עוברות לגיליון של המארגנים (scripts/export_event_signups.mjs,
# scripts/event_sheets.json), ושולה מקבלת הודעה אחת עם הנרשמים החדשים.
# גם: התראות שבעל הלוח ביקש מדף הניהול בפורטל (scripts/push_queue.mjs, pushRequests).
# בדיקה: אנשי צוות שלא יכולים להיכנס לאפליקציית הנוכחות (scripts/staff_logins.mjs).
# שלב שלישי: טבלת "הבאת חבר" של החודש למסמך הציבורי boardPublic/referrals (scripts/referrals.mjs).
#
# משתמש ב-service account הקיים (FIREBASE_SERVICE_ACCOUNT). אין סוד נוסף.
#
# פרטיות: הריפו ציבורי, ולכן ליומן ההרצה מודפסים רק מספרים — לעולם לא שמות או טלפונים.
on:
  schedule:
    - cron: "17 * * * *"   # כל שעה
  # הלו"ז של GitHub לא הפעיל את הקובץ הזה אף פעם מאז שנוסף (20.10.2026), בזמן ש"Agents" רץ כל 10 דקות.
  # לכן הוא רץ גם בסוף כל ריצה של Agents. ההרצה בטוחה לחזרה: מה שכבר טופל מסומן ולא נשלח פעמיים.
  workflow_run:
    workflows: ["Agents"]
    types: [completed]
  workflow_dispatch:       # מאפשר גם הרצה ידנית מהלשונית Actions

permissions:
  contents: read

concurrency:
  group: board-members
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: agents
        run: npm ci --no-audit --no-fund

      - name: Match board members to players
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/match_board_members.mjs

      - name: Export event signups to the organisers' sheet
        if: success() || failure()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/export_event_signups.mjs

      - name: Push notifications requested from the portal admin page (pushRequests)
        if: success() || failure()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/push_queue.mjs

      - name: Referrals leaderboard (boardPublic/referrals)
        if: success() || failure()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/referrals.mjs

      # כניסה עם Google בלוח מוחקת סיסמה של צוות עם אותו אימייל — לכן הבדיקה כאן, אחרי ההתאמה
      - name: Staff who cannot sign in to the attendance app (scripts/staff_logins.mjs)
        if: success() || failure()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/staff_logins.mjs

      - name: Tell the owner on WhatsApp that the match or export failed
        if: failure()
        working-directory: agents
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_KEY: board-members
          ALERT_TEXT: "❌ התאמת הנרשמים באפליקציית המועדון לשחקנים, העברת ההרשמות לאירועים לגיליון או טבלת הבאת חבר נכשלה. פרטים: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: node alert.mjs
