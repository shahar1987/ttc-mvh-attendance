name: Nightly backup

on:
  schedule:
    - cron: "0 23 * * *"   # 02:00 שעון ישראל — אחרי שכל האימונים נרשמו
  workflow_dispatch:      # מאפשר גם הרצה ידנית מהלשונית Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-cloud-firestore

      - name: Write service account
        run: |
          umask 077
          printf '%s' "$FIREBASE_SA_JSON" > /tmp/sa.json
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SA_JSON }}

      - name: Export Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: python backup/export_firestore.py backup-out

      - name: Push to the private backups repo
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          STAMP=$(TZ=Asia/Jerusalem date +%Y-%m-%d)
          git clone --depth 1 \
            "https://x-access-token:${BACKUP_TOKEN}@github.com/shahar1987/ttc-mvh-backups.git" repo
          mkdir -p "repo/daily"
          cp -r "backup-out/$STAMP" "repo/daily/$STAMP"
          cd repo
          git config user.name  "backup-bot"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים — לא נוצר קומיט"
          else
            git commit -m "backup $STAMP"
            git push
          fi

      - name: Verify the backup is not empty
        run: |
          STAMP=$(TZ=Asia/Jerusalem date +%Y-%m-%d)
          cat "backup-out/$STAMP/_summary.json"
