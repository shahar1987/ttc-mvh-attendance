name: Daily data backup

# מייצא מדי יום את attendance, cancellations ו-players מ-Firestore ל-JSON,
# ודוחף אותם לריפו הפרטי shahar1987/ttc-mvh-backups (לא לריפו הזה — הריפו
# הזה ציבורי, וזה היה חושף שמות ילדים וטלפוני הורים לכל אחד באינטרנט).
#
# דורש שני סודות (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — כבר קיים בריפו הזה
#   BACKUP_REPO_TOKEN — PAT מסוג fine-grained, הרשאת Contents: Read and
#     write, מוגבל אך ורק לריפו ttc-mvh-backups (ראו README שם)
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the Firebase admin library
        run: npm install firebase-admin@12.7.0 --no-audit --no-fund

      - name: Export collections and push to the private backup repo
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: node scripts/export_backup.mjs

      - name: Open an issue if the backup failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ הגיבוי היומי של נתוני הנוכחות נכשל" \
            --body "ריצה שנכשלה: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.repository_owner }} || true
