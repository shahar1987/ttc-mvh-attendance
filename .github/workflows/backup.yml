name: Nightly backup

# מייצא מדי לילה את כל האוספים מ-Firestore (ובהם attendance, cancellations, players,
# tournaments; backup/export_firestore.py) ודוחף אותם ל-shahar1987/ttc-mvh-backups
# הפרטי — לא לריפו הזה, כי הוא ציבורי והנתונים כוללים שמות ילדים,
# טלפוני הורים ושיוך לקבוצות (כולל פרקינסון). ראו README שם.
#
# דורש שני סודות (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT — כבר קיים בריפו הזה (אותו אחד ש-Account
#     tools משתמש בו, Firebase console → Project settings → Service
#     accounts → Generate new private key)
#   BACKUP_DEPLOY_KEY — מפתח SSH פרטי. החלק הציבורי שלו מוגדר כ-Deploy key
#     עם הרשאת כתיבה בריפו ttc-mvh-backups בלבד (Settings → Deploy keys
#     שם). בלי תאריך תפוגה.
on:
  schedule:
    - cron: "0 23 * * *"   # 02:00 שעון ישראל — אחרי שכל האימונים נרשמו
  workflow_dispatch:      # מאפשר גם הרצה ידנית מהלשונית Actions
    inputs:
      allow_drop:
        description: "לאשר ירידה של יותר מ-20% במספר המסמכים (רק אחרי מחיקה מכוונת)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # tzdata — לשעון ישראל (zoneinfo) גם אם חסר במערכת
      - run: pip install google-cloud-firestore tzdata

      # בדיקה מוקדמת: עדיף להיכשל מיד עם הודעה ברורה
      # מאשר באמצע הריצה עם שגיאה מבלבלת.
      - name: Check that the secrets exist
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          MISSING=""
          [ -z "$FIREBASE_SERVICE_ACCOUNT" ]  && MISSING="$MISSING FIREBASE_SERVICE_ACCOUNT"
          [ -z "$BACKUP_DEPLOY_KEY" ] && MISSING="$MISSING BACKUP_DEPLOY_KEY"
          if [ -n "$MISSING" ]; then
            echo "חסרים Secrets:$MISSING"
            echo "להוסיף ב: Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "שני ה-Secrets קיימים"

      - name: Write service account
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > /tmp/sa.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # משכפלים את ריפו הגיבויים לפני היצוא, כדי להשוות לסיכום של הלילה הקודם
      - name: Clone the private backups repo
        env:
          BACKUP_DEPLOY_KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$BACKUP_DEPLOY_KEY" > /tmp/deploy_key
          export GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:shahar1987/ttc-mvh-backups.git repo

      # נכשל (והגיבוי הקודם לא נדרס) אם אוסף גדול ירד ביותר מ-20% מאתמול
      - name: Export Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          PREVIOUS_SUMMARY: repo/_summary.json
          BACKUP_ALLOW_DROP: ${{ inputs.allow_drop && '1' || '' }}
        run: python backup/export_firestore.py backup-out

      - name: Show what was exported
        run: cat backup-out/_summary.json

      - name: Push to the private backups repo
        run: |
          STAMP=$(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')
          export GIT_SSH_COMMAND="ssh -i /tmp/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          # קבצים קבועים שנדרסים — ההיסטוריה נשמרת ב-git
          cp backup-out/*.json repo/

          cd repo
          git config user.name  "backup-bot"
          git config user.email "noreply@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "אין שינויים מאתמול — לא נוצר קומיט"
          else
            git commit -m "backup $STAMP"
            git push
            echo "הגיבוי נדחף"
          fi

      # עותק נוסף בגוגל דרייב של שולה — ראו backup/upload_drive.py
      - name: Copy to Google Drive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
        run: python backup/upload_drive.py backup-out

      - uses: actions/setup-node@v5
        if: failure()
        with:
          node-version: 22

      # התראה לשולה בוואטסאפ דרך התור של הבוט (agentReports/bot.outbox) — עובד גם כש-Issues כבויים
      - name: Tell the owner on WhatsApp that the backup failed
        if: failure()
        working-directory: agents
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ALERT_KEY: backup
          ALERT_TEXT: "❌ הגיבוי הלילי נכשל. פרטים: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          npm ci --no-audit --no-fund
          node alert.mjs

      - name: Open an issue if the backup failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ הגיבוי הלילי נכשל" \
            --body "ריצה שנכשלה: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.repository_owner }}
