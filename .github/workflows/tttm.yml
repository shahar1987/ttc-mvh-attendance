name: Refresh TTTM ranking

# מושך מאתר האיגוד את השחקנים, הדירוג, הקבוצות, טבלאות הליגה והמשחקים,
# וכותב tttm.json שהאפליקציה קוראת. רץ פעמיים בשבוע ואפשר גם ידנית.
#
# האתר יושב מאחורי Cloudflare שחוסם לפי טביעת אצבע של TLS, ולכן הסקרייפר
# משתמש ב-curl_cffi שמחקה דפדפן Chrome אמיתי. בלי זה מתקבל 403 משרתי GitHub.
on:
  schedule:
    - cron: "17 3 * * 0,3"
  workflow_dispatch:

# הרשאות כתיבה רק ל-job שצריך אותן (למטה), לא לכל ה-workflow
permissions: {}

concurrency:
  group: tttm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # דחיפת tttm.json
      actions: write # gh workflow run deploy.yml
      issues: write # issue כשהמשיכה נכשלת
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape the association site
        run: python scraper/tttm_scraper.py --dry-run --out snapshot.json

      - name: Build tttm.json for the app
        run: |
          python scraper/to_portal.py snapshot.json tttm.json
          rm -f snapshot.json

      # דחיפה מתוך Action לא מפעילה בנייה מחדש (הגנה של GitHub מפני לולאות),
      # ולכן מפעילים את "Build and deploy" במפורש כדי שהנתונים יגיעו לאתר.
      - name: Commit, push and redeploy when the data changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tttm.json
          if git diff --cached --quiet; then
            echo "no change - nothing to commit"
          else
            git commit -m "עדכון נתונים מאתר האיגוד"
            # מישהו יכול היה לדחוף קוד בזמן שהסקרייפר רץ — מושכים לפני הדחיפה
            git pull --rebase --autostash origin main
            git push
            gh workflow run deploy.yml --ref main
            echo "site rebuild requested"
          fi

      # failure() ולא !success() — ריצה שבוטלה אינה תקלה. בלי "|| true": אם Issues כבויים זה ייכשל בגלוי
      - name: Open an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "❌ משיכת הנתונים מאתר האיגוד נכשלה" \
            --body "ריצה שנכשלה: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --assignee ${{ github.repository_owner }}
