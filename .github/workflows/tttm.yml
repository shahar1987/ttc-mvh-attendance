name: Refresh TTTM ranking

# מושך מאתר האיגוד את השחקנים, הדירוג, הקבוצות, טבלאות הליגה והמשחקים,
# וכותב tttm.json שהאפליקציה קוראת. רץ פעמיים בשבוע ואפשר גם ידנית.
#
# האתר יושב מאחורי Cloudflare שחוסם לפי טביעת אצבע של TLS, ולכן הסקרייפר
# משתמש ב-curl_cffi שמחקה דפדפן Chrome אמיתי. בלי זה מתקבל 403 משרתי GitHub.
on:
  schedule:
    - cron: "17 3 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tttm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape the association site
        run: python scraper/tttm_scraper.py --dry-run --out snapshot.json

      - name: Build tttm.json for the app
        run: |
          python scraper/to_portal.py snapshot.json tttm.json
          rm -f snapshot.json

      - name: Commit and push when the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tttm.json
          if git diff --cached --quiet; then
            echo "no change - nothing to commit"
          else
            git commit -m "עדכון נתונים מאתר האיגוד"
            git push
          fi
