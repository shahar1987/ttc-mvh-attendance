# שולה — בוט הוואטסאפ (עוזרת אישית + מערכת הנוכחות) — Cloudflare Worker בתוכנית החינמית.
# השם shula-whatsapp מחליף את ה-worker שנערך ידנית בדשבורד, באותה כתובת.
# עולה אוטומטית מ-.github/workflows/agents-setup.yml; הסודות מוגדרים שם (wrangler secret).
name = "shula-whatsapp"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# משתנים שהוגדרו בדשבורד (ALLOWED_FROM, WA_PHONE_ID) נשארים בפריסה — לא כותבים כאן מספר טלפון, הריפו ציבורי
keep_vars = true

# 🕵️ מפקח השיחות — כל יום ב-17:00 UTC; ⏰ תזכורות למאמנים והודעות מתוזמנות — כל רבע שעה
[triggers]
crons = ["0 17 * * *", "*/15 * * * *"]

[vars]
META_APP_ID = "2171414330077933" # מזהה האפליקציה של Meta, לא סוד
WHATSAPP_WABA_ID = "2217359029663578" # מזהה חשבון הוואטסאפ העסקי, לא סוד
ROUTINE_ID = "trig_013fJCvCCiZUvJiQbxji5whZ" # המשימה הקבועה של קלוד שמבצעת בקשות מייל/יומן — מזהה, לא סוד
PUBLIC_URL = "https://shula-whatsapp.shahar1987.workers.dev" # הכתובת של ה-worker, לקישורים קצרים (shortLinks)
PARENT_MSG_NAG = "on" # 📨 תזכורת בוקר למאמנים על הודעות היעדרות שלא נשלחו (reminders.js). שולה אישרה את הנוסח ב-18.10.2026 ("off" לכיבוי)
FEED_KEY_SHA256 = "94fee1ce1a3289cb5bbb4f5d7bb696351b8e4e6ff873098ee9d5f994687c1065" # 📥 /insights/feed — רק ה-hash; המפתח במשימה הלילית של קלוד
INBOX_KEY_SHA256 = "f570a9f435394e4c6d1beaf5f2febf72f2cc78bae83adedb14bc60e6e6759771" # רק ה-hash; המפתח עצמו שמור ברוטינה של קלוד

# 🎤 Whisper לתמלול הקלטות כשגוגל חוסם — Workers AI, מכסה יומית חינמית
[ai]
binding = "AI"

# לוגים של ה-worker בדשבורד של Cloudflare (שגיאות cron ו-webhook) — חינמי
[observability]
enabled = true
