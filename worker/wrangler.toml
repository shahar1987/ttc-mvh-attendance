# שולה — בוט הוואטסאפ (עוזרת אישית + מערכת הנוכחות) — Cloudflare Worker בתוכנית החינמית.
# השם shula-whatsapp מחליף את ה-worker שנערך ידנית בדשבורד, באותה כתובת.
# עולה אוטומטית מ-.github/workflows/agents-setup.yml; הסודות מוגדרים שם (wrangler secret).
name = "shula-whatsapp"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
